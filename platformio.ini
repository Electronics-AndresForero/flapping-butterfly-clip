; Flapping Butterfly Clip — ESP32-C3 with integrated 0.42" OLED (72x40)
; Inspired by "Flapping Butterfly Clip v2" (see README for credit). Firmware is an independent rewrite.
;
;   bench     Phase 1: USB powered, push-button, any 5 V servo on the 5 V pin
;   wearable  Phase 2: LiPo + 2 g servo + TTP223 touch + battery monitor
;   hwcheck   One-off tool: I2C scan, free-pin list, ADC read (run this FIRST)

[platformio]
default_envs = bench

[env]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Native USB-CDC so Serial works over the board's USB-C port (no UART bridge on this board)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    madhephaestus/ESP32Servo@^3.0.6
    olikraus/U8g2@^2.35.30

[env:bench]
build_flags =
    ${env.build_flags}
    -DBUILD_BENCH

[env:wearable]
build_flags =
    ${env.build_flags}
    -DBUILD_WEARABLE

[env:hwcheck]
build_src_filter = -<*> +<../tools/hwcheck/>
